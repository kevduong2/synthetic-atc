[project]
name = "atc-gan"
version = "0.1.0"
description = "Synthetic ATC radio audio generator (TTS + DSP + GAN channel model) for ASR training data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "torch>=2.4",
    "torchaudio>=2.4",
    "kokoro>=0.9",
    "datasets>=2.20,<4",
    "transformers>=4.44",
    "jiwer>=3.0",
    "accelerate>=0.33",
    "tqdm>=4.66",
    "librosa>=0.11.0",
    "pyyaml>=6.0.3",
    "pyloudnorm>=0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Only the HTML report's plots need an extra package. The Tier 1/2 embedding
# metrics (embed_dist.py, probe.py) add nothing: WavLM *and* CLAP both ship in
# `transformers`, already a base dependency, so `laion-clap` is not required.
eval = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atcgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
mlbucket = { path = "../MLBucket/sdk", editable = true }

[dependency-groups]
dev = [
    "mlbucket",
]
