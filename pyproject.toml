[project]
name = "atc-gan"
version = "0.1.0"
description = "Synthetic ATC radio audio generator (TTS + DSP + GAN channel model) for ASR training data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "torch>=2.4",
    "torchaudio>=2.4",
    "kokoro>=0.9",
    "datasets>=2.20,<4",
    "transformers>=4.44",
    "jiwer>=3.0",
    "accelerate>=0.33",
    "tqdm>=4.66",
    "librosa>=0.11.0",
    "pyyaml>=6.0.3",
    "pyloudnorm>=0.1",
    # Kokoro's G2P (misaki) does `spacy.load("en_core_web_sm")` and would try to
    # pip-install it on first use; uv venvs have no pip, so pin the wheel here.
    "en-core-web-sm",
]

[project.optional-dependencies]
# Only the HTML report's plots need an extra package. The Tier 1/2 embedding
# metrics (embed_dist.py, probe.py) add nothing: WavLM *and* CLAP both ship in
# `transformers`, already a base dependency, so `laion-clap` is not required.
eval = ["matplotlib>=3.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atcgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Windows: PyPI's win_amd64 torch wheel is CPU-only, so resolve torch/torchaudio
# from the CUDA 12.6 index there (RTX 3080 needs NVIDIA driver >= 560). macOS and
# Linux keep PyPI. To move to a newer CUDA, change the index url and re-lock.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.0"]
