[project]
name = "atc-gan"
version = "0.1.0"
description = "Synthetic ATC radio audio generator (TTS + DSP + GAN channel model) for ASR training data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "soundfile>=0.12",
    "torch>=2.4",
    "torchaudio>=2.4",
    "kokoro>=0.9",
    "datasets>=2.20,<4",
    "transformers>=4.44",
    "jiwer>=3.0",
    "accelerate>=0.33",
    "tqdm>=4.66",
    "librosa>=0.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["atcgen"]

[tool.pytest.ini_options]
testpaths = ["tests"]
